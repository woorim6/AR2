name: iOS Unsigned IPA Build

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs pull

      - name: Find Project and Build Unsigned App
        run: |
          XCODE_PROJ=$(find . -maxdepth 4 -name "Unity-iPhone.xcodeproj" -print -quit)
          if [ -z "$XCODE_PROJ" ]; then
            echo "Error: Unity-iPhone.xcodeproj not found!"
            exit 1
          fi

          PROJ_DIR=$(dirname "$XCODE_PROJ")
          echo "Found project: $XCODE_PROJ in $PROJ_DIR"

          chmod +x "$PROJ_DIR"/*.sh 2>/dev/null || true

          xcodebuild -project "$PROJ_DIR/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$PROJ_DIR/build_output" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            clean build

      - name: Package to IPA
        run: |
          XCODE_PROJ=$(find . -maxdepth 4 -name "Unity-iPhone.xcodeproj" -print -quit)
          PROJ_DIR=$(dirname "$XCODE_PROJ")
          mkdir -p "$PROJ_DIR/Payload"
          APP_PATH=$(find "$PROJ_DIR/build_output/Build/Products/Release-iphoneos" -name "*.app" -maxdepth 1 -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          cp -r "$APP_PATH" "$PROJ_DIR/Payload/"
          (cd "$PROJ_DIR" && zip -r app-unsigned.ipa Payload)
          echo "IPA_PATH=$PROJ_DIR/app-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 7
