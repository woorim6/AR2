# 3. 메인 타깃 및 Framework 무서명 빌드
      - name: Build Unsigned App
        run: |
          XCODE_PROJ=$(find . -maxdepth 4 -name "Unity-iPhone.xcodeproj" -print -quit)
          if [ -z "$XCODE_PROJ" ]; then
            echo "Error: Unity-iPhone.xcodeproj not found!"
            exit 1
          fi
          echo "Using project: $XCODE_PROJ"

          xcodebuild -project "$XCODE_PROJ" \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            clean build
